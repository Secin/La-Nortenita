services:
  - type: web
    name: la-nortenita-web
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/lanortenita.sqlite
    disk:
      name: nortenita-data
      mountPath: /var/data
      sizeGB: 1
